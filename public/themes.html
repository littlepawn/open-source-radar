<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>开源雷达 · 主题选择</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0d10; color: #e6e9ef;
    font: 14px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif;
    padding: 28px 24px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: #8b94a3; font-size: 13px; margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(430px, 100%), 1fr)); gap: 22px; }

  .pick { border: 1px solid #222834; border-radius: 14px; overflow: hidden; background: #10141a; }
  .pick > header { padding: 12px 14px; display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid #1c222c; }
  .pick > header b { font-size: 14px; }
  .pick > header span { font-size: 11.5px; color: #77808f; }
  .pick > header em { margin-left: auto; font-style: normal; font-size: 11px; color: #5b6472; }
  .pick.cur > header em { color: #6ee7b7; }

  /* 预览画布：用容器变量隔离，避免互相污染 */
  .pane { padding: 0; }

  /* ============ 主题 1 · 深空（当前） ============ */
  .t1 {
    --bg:#0f1115; --soft:#151922; --card:#171c26; --line:#262c38;
    --text:#e6e9ef; --dim:#98a2b3; --faint:#6b7482; --accent:#6ee7b7; --accent2:#60a5fa;
    --radius:12px;
  }
  /* ============ 主题 2 · 石墨（中性灰，低饱和） ============ */
  .t2 {
    --bg:#131417; --soft:#191b1f; --card:#1d2025; --line:#2a2e35;
    --text:#e8e8ea; --dim:#9a9da4; --faint:#71757c; --accent:#c9d1d9; --accent2:#8ab4f8;
    --radius:10px;
  }
  /* ============ 主题 3 · 午夜蓝（冷调，蓝紫点缀） ============ */
  .t3 {
    --bg:#0a0f1e; --soft:#101a30; --card:#14213a; --line:#20304d;
    --text:#e4ecfa; --dim:#8fa3c4; --faint:#61759a; --accent:#7aa2ff; --accent2:#a78bfa;
    --radius:14px;
  }
  /* ============ 主题 4 · 暖夜（暖灰 + 琥珀） ============ */
  .t4 {
    --bg:#14110e; --soft:#1c1713; --card:#221c17; --line:#332a22;
    --text:#f0e7dd; --dim:#b0a294; --faint:#7d7266; --accent:#f0b060; --accent2:#e8834a;
    --radius:12px;
  }
  /* ============ 主题 5 · 极简纸（亮色，克制） ============ */
  .t5 {
    --bg:#f7f7f5; --soft:#ffffff; --card:#ffffff; --line:#e4e3de;
    --text:#17171a; --dim:#5f6066; --faint:#8d8e94; --accent:#111114; --accent2:#3b6ef0;
    --radius:10px;
  }
  /* ============ 主题 6 · 霓虹终端（高对比，等宽） ============ */
  .t6 {
    --bg:#07090b; --soft:#0b0f12; --card:#0d1317; --line:#16241f;
    --text:#d7ffe9; --dim:#7fae95; --faint:#4e7561; --accent:#00e58a; --accent2:#22d3ee;
    --radius:8px;
  }

  .mini {
    background: var(--bg); color: var(--text); display: grid;
    grid-template-columns: 132px 1fr; height: 300px; font-size: 11px;
  }
  .mini aside {
    background: var(--soft); border-right: 1px solid var(--line);
    padding: 10px 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .mini .logo { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
  .mini .ni {
    padding: 5px 7px; border-radius: calc(var(--radius) - 4px); color: var(--dim);
    display: flex; justify-content: space-between;
  }
  .mini .ni.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .mini .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .mini .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; font-size: 9.5px; color: var(--dim);
  }
  .mini .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .mini .btn {
    margin-top: auto; background: var(--accent); color: var(--bg); border-radius: calc(var(--radius) - 3px);
    padding: 6px; text-align: center; font-weight: 600; font-size: 10.5px;
  }
  .mini .main2 { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .mini .search {
    background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) - 3px);
    padding: 6px 9px; color: var(--faint);
  }
  .mini .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .mini .c {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .mini .c .t { font-weight: 600; color: var(--text); font-size: 10.5px; }
  .mini .c .d { color: var(--dim); font-size: 9.5px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .c .row { display: flex; gap: 4px; margin-top: 2px; }
  .mini .c .row .chip { font-size: 8.5px; padding: 0 4px; }
  .mini .c .st { color: var(--faint); font-size: 9px; margin-top: auto; }
  .mini.t6, .mini.t6 * { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .mini.t4 .logo, .mini.t5 .logo { font-family: ui-serif, Georgia, serif; }

  .acts { padding: 10px 14px; border-top: 1px solid #1c222c; display: flex; gap: 8px; align-items: center; }
  .acts button {
    background: #1b2230; color: #cdd5e1; border: 1px solid #2a3444; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .acts button:hover { background: #232c3c; }
  .acts button.pick1 { background: #6ee7b7; color: #06251a; border-color: #6ee7b7; font-weight: 600; }
  .acts .tag { font-size: 11px; color: #6b7482; margin-left: auto; }
</style>
</head>
<body>
<h1>开源雷达 · 选一套视觉风格</h1>
<div class="lead">下面是同一界面的 6 种配色与质感。点「用这套」记下编号告诉我，或直接在页面上切换预览。</div>

<div class="grid" id="grid"></div>

<script>
const themes = [
  { id: "t1", name: "深空", desc: "当前版本 · 墨绿主色 + 蓝辅助", note: "最稳，长时间看不累" },
  { id: "t2", name: "石墨", desc: "中性灰 · 近乎无彩色", note: "冷静克制，像 IDE" },
  { id: "t3", name: "午夜蓝", desc: "冷调深蓝 · 蓝紫渐变感", note: "最有科技感" },
  { id: "t4", name: "暖夜", desc: "暖灰棕底 · 琥珀点缀", note: "护眼，适合夜里" },
  { id: "t5", name: "极简纸", desc: "亮色 · 黑白为主", note: "像文档，打印友好" },
  { id: "t6", name: "霓虹终端", desc: "近黑 + 荧光绿 · 等宽字体", note: "极客味最重" },
];
const cardHtml = (t) => `
<div class="mini ${t.id}">
  <aside>
    <div class="logo">◎ 开源雷达</div>
    <div class="ni on"><span>▦ 全部</span><span>150</span></div>
    <div class="ni"><span>★ 我 Star 的</span><span>147</span></div>
    <div class="ni"><span>⑂ 我的 Fork</span><span>3</span></div>
    <div class="chips">
      <span class="chip on">AI / Agent 14</span><span class="chip">数据库 16</span>
      <span class="chip">命令行 14</span><span class="chip">自托管 14</span>
    </div>
    <div class="btn">同步 GitHub</div>
  </aside>
  <div class="main2">
    <div class="search">搜索仓库名 / 描述 / topics…</div>
    <div class="cards2">
      <div class="c"><div class="t">superpowers</div>
        <div class="d">归类：AI / Agent、数据库。技能框架，让 agent 按方法论工作。</div>
        <div class="row"><span class="chip">AI / Agent</span><span class="chip">数据库</span></div>
        <div class="st">★ 306k · Shell</div></div>
      <div class="c"><div class="t">public-apis</div>
        <div class="d">A collective list of free APIs for use in software development.</div>
        <div class="row"><span class="chip">文档办公</span></div>
        <div class="st">★ 492k · Python</div></div>
    </div>
  </div>
</div>`;

document.getElementById("grid").innerHTML = themes.map((t, i) => `
  <section class="pick" data-id="${t.id}">
    <header><b>${i + 1}. ${t.name}</b><span>${t.desc}</span><em>${t.note}</em></header>
    <div class="pane">${cardHtml(t)}</div>
    <div class="acts">
      <button data-pick="${t.id}">用这套</button>
      <span class="tag">${t.id}</span>
    </div>
  </section>`).join("") + `
  <section class="pick" style="padding:16px">
    <b style="font-size:14px">也可以混搭</b>
    <div style="color:#8b94a3;font-size:12.5px;margin-top:8px;line-height:1.8">
      · 配色选一套，字体/圆角可以另外指定<br>
      · 想要「亮色 + 荧光绿」或「深空 + 琥珀」这类组合，也可以直接说<br>
      · 登录页会随主题一起变
    </div>
  </section>`;

// 选中态只有一个真源 selectedId，class / 按钮文案 / cur 徽标全部由它派生，
// 否则换选后旧的按钮会留着「已选 · tX」而页面同时显示两个选中。
const THEME_IDS = new Set(themes.map((t) => t.id));
function syncSelection() {
  const fromHash = (location.hash || "").replace(/^#/, "");
  const selectedId = THEME_IDS.has(fromHash) ? fromHash : "t1";
  document.querySelectorAll(".pick[data-id]").forEach((sec) => {
    const on = sec.dataset.id === selectedId;
    sec.classList.toggle("cur", on);
    const b = sec.querySelector("[data-pick]");
    if (b) {
      b.classList.toggle("pick1", on);
      b.textContent = on ? "已选 · " + sec.dataset.id : "用这套";
    }
  });
  return selectedId;
}
document.querySelectorAll("[data-pick]").forEach((b) => {
  b.onclick = () => { location.hash = b.dataset.pick; syncSelection(); };
});
window.addEventListener("hashchange", syncSelection);
syncSelection();
</script>
</body>
</html>
