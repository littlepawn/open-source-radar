services:
  radar:
    image: ${RADAR_IMAGE:-littlepawn/open-source-radar:latest}
    build: .
    container_name: open-source-radar
    restart: unless-stopped
    ports:
      - "${RADAR_PORT:-8788}:8788"
    volumes:
      - radar-data:/data
    environment:
      # 可选：设了环境变量 token 就免登录（单用户自托管最省事）
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 会话与加密密钥；不设会自动生成并持久化在 /data/radar.db 里
      SESSION_SECRET: ${SESSION_SECRET:-}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null 'http://127.0.0.1:8788/login' 2>&1 | grep -q 200 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radar-data:
